name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  APP_ENV: testing

jobs:
  changes:
    name: Change Classification
    runs-on: ubuntu-latest
    outputs:
      docs_only: ${{ steps.classify.outputs.docs_only }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Classify changed paths
        id: classify
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          CURRENT_SHA: ${{ github.sha }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          docs_only="$(bash bin/ci/classify-changes)"
          printf 'docs_only=%s\n' "$docs_only" >> "$GITHUB_OUTPUT"

  dependency-audit:
    name: Dependency Audit
    needs: changes
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Fail closed when change classification fails
        if: needs.changes.result != 'success'
        run: exit 1

      - name: Docs-only success path
        if: needs.changes.result == 'success' && needs.changes.outputs.docs_only == 'true'
        run: printf 'Dependency Audit skipped for documentation-only changes.\n'

      - uses: actions/checkout@v4
        if: needs.changes.result == 'success' && needs.changes.outputs.docs_only != 'true'
      - uses: shivammathur/setup-php@v2
        if: needs.changes.result == 'success' && needs.changes.outputs.docs_only != 'true'
        with:
          php-version: '8.4'
          extensions: bcmath, ctype, fileinfo, json, mbstring, openssl, pdo, pdo_sqlite, tokenizer, xml
      - uses: actions/setup-node@v4
        if: needs.changes.result == 'success' && needs.changes.outputs.docs_only != 'true'
        with:
          node-version: '22'
          cache: npm
      - run: composer install --no-interaction --prefer-dist --no-progress
        if: needs.changes.result == 'success' && needs.changes.outputs.docs_only != 'true'
      - run: npm ci --prefer-offline --no-audit
        if: needs.changes.result == 'success' && needs.changes.outputs.docs_only != 'true'
      - run: composer audit --locked --ignore-severity=medium --ignore-severity=low --abandoned=report
        if: needs.changes.result == 'success' && needs.changes.outputs.docs_only != 'true'
      - run: npm audit --omit=dev --audit-level=high
        if: needs.changes.result == 'success' && needs.changes.outputs.docs_only != 'true'

  style:
    name: Pint
    needs: changes
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Fail closed when change classification fails
        if: needs.changes.result != 'success'
        run: exit 1

      - name: Docs-only success path
        if: needs.changes.result == 'success' && needs.changes.outputs.docs_only == 'true'
        run: printf 'Pint skipped for documentation-only changes.\n'

      - uses: actions/checkout@v4
        if: needs.changes.result == 'success' && needs.changes.outputs.docs_only != 'true'
      - uses: shivammathur/setup-php@v2
        if: needs.changes.result == 'success' && needs.changes.outputs.docs_only != 'true'
        with:
          php-version: '8.4'
          extensions: bcmath, ctype, fileinfo, json, mbstring, openssl, pdo, pdo_sqlite, tokenizer, xml
      - run: composer install --no-interaction --prefer-dist --no-progress
        if: needs.changes.result == 'success' && needs.changes.outputs.docs_only != 'true'
      - run: vendor/bin/pint --test --parallel --max-processes=2
        if: needs.changes.result == 'success' && needs.changes.outputs.docs_only != 'true'

  frontend-build:
    name: Frontend Build
    needs: changes
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Fail closed when change classification fails
        if: needs.changes.result != 'success'
        run: exit 1

      - name: Docs-only success path
        if: needs.changes.result == 'success' && needs.changes.outputs.docs_only == 'true'
        run: printf 'Frontend Build skipped for documentation-only changes.\n'

      - uses: actions/checkout@v4
        if: needs.changes.result == 'success' && needs.changes.outputs.docs_only != 'true'
      - uses: shivammathur/setup-php@v2
        if: needs.changes.result == 'success' && needs.changes.outputs.docs_only != 'true'
        with:
          php-version: '8.4'
          extensions: bcmath, ctype, fileinfo, json, mbstring, openssl, pdo, pdo_sqlite, tokenizer, xml
      - uses: actions/setup-node@v4
        if: needs.changes.result == 'success' && needs.changes.outputs.docs_only != 'true'
        with:
          node-version: '22'
          cache: npm
      - run: composer install --no-interaction --prefer-dist --no-progress
        if: needs.changes.result == 'success' && needs.changes.outputs.docs_only != 'true'
      - run: npm ci --prefer-offline --no-audit
        if: needs.changes.result == 'success' && needs.changes.outputs.docs_only != 'true'
      - run: cp .env.example .env
        if: needs.changes.result == 'success' && needs.changes.outputs.docs_only != 'true'
      - run: php artisan key:generate
        if: needs.changes.result == 'success' && needs.changes.outputs.docs_only != 'true'
      - run: php artisan wayfinder:generate
        if: needs.changes.result == 'success' && needs.changes.outputs.docs_only != 'true'
        env:
          APP_ENV: local
      - run: npm run build
        if: needs.changes.result == 'success' && needs.changes.outputs.docs_only != 'true'
      - name: Bind frontend artifact to exact source and file digests
        if: needs.changes.result == 'success' && needs.changes.outputs.docs_only != 'true'
        run: php bin/ci/frontend-artifact create public/build
      - uses: actions/upload-artifact@v4
        if: needs.changes.result == 'success' && needs.changes.outputs.docs_only != 'true'
        with:
          name: frontend-build-assets
          path: public/build
          retention-days: 1

  generated-drift:
    name: Generated Drift
    needs: [changes, frontend-build]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Fail closed when change classification fails
        if: needs.changes.result != 'success'
        run: exit 1

      - name: Docs-only success path
        if: needs.changes.result == 'success' && needs.changes.outputs.docs_only == 'true'
        run: printf 'Generated Drift skipped for documentation-only changes.\n'

      - name: Fail closed if frontend build failed
        if: needs.changes.result == 'success' && needs.changes.outputs.docs_only != 'true'
        run: test "${{ needs.frontend-build.result }}" = success

      - uses: actions/checkout@v4
        if: needs.changes.result == 'success' && needs.changes.outputs.docs_only != 'true'
      - uses: shivammathur/setup-php@v2
        if: needs.changes.result == 'success' && needs.changes.outputs.docs_only != 'true'
        with:
          php-version: '8.4'
          extensions: bcmath, ctype, fileinfo, json, mbstring, openssl, pdo, pdo_sqlite, tokenizer, xml
      - run: composer install --no-interaction --prefer-dist --no-progress
        if: needs.changes.result == 'success' && needs.changes.outputs.docs_only != 'true'
      - run: cp .env.example .env
        if: needs.changes.result == 'success' && needs.changes.outputs.docs_only != 'true'
      - run: php artisan key:generate
        if: needs.changes.result == 'success' && needs.changes.outputs.docs_only != 'true'
      - run: test -z "$(git ls-files resources/js/actions resources/js/routes)"
        if: needs.changes.result == 'success' && needs.changes.outputs.docs_only != 'true'
      - run: php artisan wayfinder:generate
        if: needs.changes.result == 'success' && needs.changes.outputs.docs_only != 'true'
        env:
          APP_ENV: local
      - run: |
          test -n "$(find resources/js/actions -type f -print -quit)"
          test -n "$(find resources/js/routes -type f -print -quit)"
        if: needs.changes.result == 'success' && needs.changes.outputs.docs_only != 'true'
      - uses: actions/download-artifact@v4
        if: needs.changes.result == 'success' && needs.changes.outputs.docs_only != 'true'
        with:
          name: frontend-build-assets
          path: public/build
      - name: Verify exact-source frontend build
        if: needs.changes.result == 'success' && needs.changes.outputs.docs_only != 'true'
        run: php bin/ci/frontend-artifact verify public/build

  phpunit-shard:
    name: PHPUnit Shard (${{ matrix.shard }}/4)
    needs: [changes, frontend-build]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - name: Fail closed when change classification fails
        if: needs.changes.result != 'success'
        run: exit 1

      - name: Docs-only success path
        if: needs.changes.result == 'success' && needs.changes.outputs.docs_only == 'true'
        run: printf 'PHPUnit Shard skipped for documentation-only changes.\n'

      - name: Fail closed if frontend build failed
        if: needs.changes.result == 'success' && needs.changes.outputs.docs_only != 'true'
        run: |
          if [[ "${{ needs.frontend-build.result }}" != "success" ]]; then
            echo "::error::Frontend build dependency failed!"
            exit 1
          fi

      - uses: actions/checkout@v4
        if: needs.changes.result == 'success' && needs.changes.outputs.docs_only != 'true'
      - uses: shivammathur/setup-php@v2
        if: needs.changes.result == 'success' && needs.changes.outputs.docs_only != 'true'
        with:
          php-version: '8.4'
          extensions: bcmath, ctype, fileinfo, json, mbstring, openssl, pdo, pdo_sqlite, tokenizer, xml
          coverage: xdebug
      - run: composer install --no-interaction --prefer-dist --no-progress
        if: needs.changes.result == 'success' && needs.changes.outputs.docs_only != 'true'
      - uses: actions/download-artifact@v4
        if: needs.changes.result == 'success' && needs.changes.outputs.docs_only != 'true'
        with:
          name: frontend-build-assets
          path: public/build
      - name: Verify frontend build assets
        if: needs.changes.result == 'success' && needs.changes.outputs.docs_only != 'true'
        run: php bin/ci/frontend-artifact verify public/build
      - run: cp .env.example .env
        if: needs.changes.result == 'success' && needs.changes.outputs.docs_only != 'true'
      - run: php artisan key:generate
        if: needs.changes.result == 'success' && needs.changes.outputs.docs_only != 'true'
      - name: Verify shard partition integrity
        if: needs.changes.result == 'success' && needs.changes.outputs.docs_only != 'true'
        run: php bin/ci/phpunit-shard verify --total=4
      - name: Generate shard configuration
        if: needs.changes.result == 'success' && needs.changes.outputs.docs_only != 'true'
        run: >-
          php bin/ci/phpunit-shard generate-config
          --shard=${{ matrix.shard }}
          --total=4
          --output=phpunit.shard.xml
          --coverage-file=build/artifacts/shard-${{ matrix.shard }}.cov
          --junit-file=build/artifacts/shard-${{ matrix.shard }}.xml
      - name: Run PHPUnit Shard ${{ matrix.shard }}/4
        if: needs.changes.result == 'success' && needs.changes.outputs.docs_only != 'true'
        run: php artisan test --compact --parallel --configuration=phpunit.shard.xml
        env:
          COLLISION_PRINTER_PROFILE: 'true'
          XDEBUG_MODE: coverage
      - uses: actions/upload-artifact@v4
        if: needs.changes.result == 'success' && needs.changes.outputs.docs_only != 'true'
        with:
          name: phpunit-shard-${{ matrix.shard }}
          path: |
            build/artifacts/shard-${{ matrix.shard }}.cov
            build/artifacts/shard-${{ matrix.shard }}.xml
          if-no-files-found: error
          retention-days: 1

  unit-feature-tests:
    name: PHPUnit Parallel
    needs: [changes, phpunit-shard]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Fail closed when change classification fails
        if: needs.changes.result != 'success'
        run: exit 1

      - name: Docs-only success path
        if: needs.changes.result == 'success' && needs.changes.outputs.docs_only == 'true'
        run: printf 'PHPUnit Parallel skipped for documentation-only changes.\n'

      - name: Fail closed if any PHPUnit shard failed
        if: needs.changes.result == 'success' && needs.changes.outputs.docs_only != 'true'
        run: |
          if [[ "${{ needs.phpunit-shard.result }}" != "success" ]]; then
            echo "::error::One or more PHPUnit shards failed! Shard matrix status: ${{ needs.phpunit-shard.result }}"
            exit 1
          fi

      - uses: actions/checkout@v4
        if: needs.changes.result == 'success' && needs.changes.outputs.docs_only != 'true'
      - uses: shivammathur/setup-php@v2
        if: needs.changes.result == 'success' && needs.changes.outputs.docs_only != 'true'
        with:
          php-version: '8.4'
          extensions: bcmath, ctype, fileinfo, json, mbstring, openssl, pdo, pdo_sqlite, tokenizer, xml
      - run: composer install --no-interaction --prefer-dist --no-progress
        if: needs.changes.result == 'success' && needs.changes.outputs.docs_only != 'true'
      - uses: actions/download-artifact@v4
        if: needs.changes.result == 'success' && needs.changes.outputs.docs_only != 'true'
        with:
          pattern: phpunit-shard-*
          path: build/artifacts
          merge-multiple: true
      - name: Aggregate Shard Results & Enforce Quality Gates
        if: needs.changes.result == 'success' && needs.changes.outputs.docs_only != 'true'
        run: php bin/ci/phpunit-aggregate --total=4 --artifacts-dir=build/artifacts --min-coverage=60 --min-tests=2211
      - name: Publish controlled per-file runtime measurements
        if: needs.changes.result == 'success' && needs.changes.outputs.docs_only != 'true'
        run: php bin/ci/phpunit-timings - "$GITHUB_SHA" build/artifacts/shard-*.xml



  seed-integrity-gate:
    name: SEED-09 — Seed Integrity & Readiness Gate
    needs: [changes, frontend-build]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Fail closed when change classification fails
        if: needs.changes.result != 'success'
        run: exit 1

      - name: Docs-only success path
        if: needs.changes.result == 'success' && needs.changes.outputs.docs_only == 'true'
        run: printf 'SEED-09 skipped for documentation-only changes.\n'

      - name: Fail closed if frontend build failed
        if: needs.changes.result == 'success' && needs.changes.outputs.docs_only != 'true'
        run: |
          if [[ "${{ needs.frontend-build.result }}" != "success" ]]; then
            echo "::error::Frontend build dependency failed!"
            exit 1
          fi

      - uses: actions/checkout@v4
        if: needs.changes.result == 'success' && needs.changes.outputs.docs_only != 'true'
      - uses: shivammathur/setup-php@v2
        if: needs.changes.result == 'success' && needs.changes.outputs.docs_only != 'true'
        with:
          php-version: '8.4'
          extensions: bcmath, ctype, fileinfo, json, mbstring, openssl, pdo, pdo_sqlite, tokenizer, xml
      - run: composer install --no-interaction --prefer-dist --no-progress
        if: needs.changes.result == 'success' && needs.changes.outputs.docs_only != 'true'
      - uses: actions/download-artifact@v4
        if: needs.changes.result == 'success' && needs.changes.outputs.docs_only != 'true'
        with:
          name: frontend-build-assets
          path: public/build
      - name: Verify frontend build assets
        if: needs.changes.result == 'success' && needs.changes.outputs.docs_only != 'true'
        run: php bin/ci/frontend-artifact verify public/build
      - run: cp .env.example .env
        if: needs.changes.result == 'success' && needs.changes.outputs.docs_only != 'true'
      - run: php artisan key:generate
        if: needs.changes.result == 'success' && needs.changes.outputs.docs_only != 'true'
      - name: Run SEED-09 Seed Integrity & Readiness Gate
        if: needs.changes.result == 'success' && needs.changes.outputs.docs_only != 'true'
        run: php artisan test --compact tests/Feature/SEED09/SeedIntegrityGateTest.php

  migration-seed:
    name: Migration and Seed
    needs: changes
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Fail closed when change classification fails
        if: needs.changes.result != 'success'
        run: exit 1

      - name: Docs-only success path
        if: needs.changes.result == 'success' && needs.changes.outputs.docs_only == 'true'
        run: printf 'Migration and Seed skipped for documentation-only changes.\n'

      - uses: actions/checkout@v4
        if: needs.changes.result == 'success' && needs.changes.outputs.docs_only != 'true'
      - uses: shivammathur/setup-php@v2
        if: needs.changes.result == 'success' && needs.changes.outputs.docs_only != 'true'
        with:
          php-version: '8.4'
          extensions: bcmath, ctype, fileinfo, json, mbstring, openssl, pdo, pdo_sqlite, tokenizer, xml
      - run: composer install --no-interaction --prefer-dist --no-progress
        if: needs.changes.result == 'success' && needs.changes.outputs.docs_only != 'true'
      - run: cp .env.example .env
        if: needs.changes.result == 'success' && needs.changes.outputs.docs_only != 'true'
      - run: php artisan key:generate
        if: needs.changes.result == 'success' && needs.changes.outputs.docs_only != 'true'
      - run: touch database/database.sqlite
        if: needs.changes.result == 'success' && needs.changes.outputs.docs_only != 'true'
      - run: php artisan migrate:fresh --seed --force
        if: needs.changes.result == 'success' && needs.changes.outputs.docs_only != 'true'
        env:
          DB_CONNECTION: sqlite
          DB_DATABASE: database/database.sqlite
          COOPERATIVE_BOOTSTRAP_ORGANIZATION_NAME: CI Test Cooperative

  openapi-drift:
    name: OpenAPI Drift
    needs: changes
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Fail closed when change classification fails
        if: needs.changes.result != 'success'
        run: exit 1

      - name: Docs-only success path
        if: needs.changes.result == 'success' && needs.changes.outputs.docs_only == 'true'
        run: printf 'OpenAPI Drift skipped for documentation-only changes.\n'

      - uses: actions/checkout@v4
        if: needs.changes.result == 'success' && needs.changes.outputs.docs_only != 'true'
      - uses: shivammathur/setup-php@v2
        if: needs.changes.result == 'success' && needs.changes.outputs.docs_only != 'true'
        with:
          php-version: '8.4'
          extensions: bcmath, ctype, fileinfo, json, mbstring, openssl, pdo, pdo_sqlite, tokenizer, xml
      - run: composer install --no-interaction --prefer-dist --no-progress
        if: needs.changes.result == 'success' && needs.changes.outputs.docs_only != 'true'
      - run: cp .env.example .env
        if: needs.changes.result == 'success' && needs.changes.outputs.docs_only != 'true'
      - run: php artisan key:generate
        if: needs.changes.result == 'success' && needs.changes.outputs.docs_only != 'true'
      - run: bin/openapi.sh check
        if: needs.changes.result == 'success' && needs.changes.outputs.docs_only != 'true'

  postgres-concurrency:
    name: PostgreSQL Concurrency
    needs: changes
    if: ${{ always() }}
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: kojaya_test
          POSTGRES_USER: kojaya
          POSTGRES_PASSWORD: kojaya
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U kojaya -d kojaya_test"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    steps:
      - name: Fail closed when change classification fails
        if: needs.changes.result != 'success'
        run: exit 1

      - name: Docs-only success path
        if: needs.changes.result == 'success' && needs.changes.outputs.docs_only == 'true'
        run: printf 'PostgreSQL Concurrency skipped for documentation-only changes.\n'

      - uses: actions/checkout@v4
        if: needs.changes.result == 'success' && needs.changes.outputs.docs_only != 'true'
      - uses: shivammathur/setup-php@v2
        if: needs.changes.result == 'success' && needs.changes.outputs.docs_only != 'true'
        with:
          php-version: '8.4'
          extensions: bcmath, ctype, fileinfo, json, mbstring, openssl, pdo, pdo_pgsql, pdo_sqlite, tokenizer, xml
      - run: composer install --no-interaction --prefer-dist --no-progress
        if: needs.changes.result == 'success' && needs.changes.outputs.docs_only != 'true'
      - run: cp .env.example .env
        if: needs.changes.result == 'success' && needs.changes.outputs.docs_only != 'true'
      - run: php artisan key:generate
        if: needs.changes.result == 'success' && needs.changes.outputs.docs_only != 'true'
      - run: vendor/bin/phpunit --configuration phpunit.pgsql.xml --testsuite PostgreSQLConcurrency
        if: needs.changes.result == 'success' && needs.changes.outputs.docs_only != 'true'
        env:
          DB_CONNECTION: pgsql
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          DB_DATABASE: kojaya_test
          DB_USERNAME: kojaya
          DB_PASSWORD: kojaya
      - run: vendor/bin/phpunit --configuration phpunit.pgsql.xml --testsuite Document05PostgreSQL
        if: needs.changes.result == 'success' && needs.changes.outputs.docs_only != 'true'
        env:
          DB_CONNECTION: pgsql
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          DB_DATABASE: kojaya_test
          DB_USERNAME: kojaya
          DB_PASSWORD: kojaya
      - name: Install PostgreSQL client tools
        if: needs.changes.result == 'success' && needs.changes.outputs.docs_only != 'true'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client
      - name: PostgreSQL Backup and Restore Drill
        if: needs.changes.result == 'success' && needs.changes.outputs.docs_only != 'true'
        run: vendor/bin/phpunit --configuration phpunit.pgsql.xml --testsuite BackupRestoreDrill --display-skipped
        env:
          DB_CONNECTION: pgsql
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          DB_DATABASE: kojaya_test
          DB_USERNAME: kojaya
          DB_PASSWORD: kojaya

  phase4-execution:
    name: Phase 4 Readiness Execution
    needs: [changes, frontend-build]
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Fail closed when change classification failed
        if: needs.changes.result != 'success'
        run: exit 1

      - name: Docs-only success path
        if: needs.changes.result == 'success' && needs.changes.outputs.docs_only == 'true'
        run: >-
          printf 'Documentation-only change: existing application readiness evidence unchanged.\n'

      - name: Fail closed on unknown classification or frontend failure
        if: needs.changes.result == 'success' && needs.changes.outputs.docs_only != 'true'
        env:
          DOCS_ONLY: ${{ needs.changes.outputs.docs_only }}
        run: |
          test "$DOCS_ONLY" = false
          test "${{ needs.frontend-build.result }}" = success

      - uses: actions/checkout@v4
        if: needs.changes.outputs.docs_only != 'true'

      - name: Setup PHP
        if: needs.changes.outputs.docs_only != 'true'
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: bcmath, ctype, fileinfo, json, mbstring, openssl, pdo, pdo_sqlite, tokenizer, xml
          tools: composer:v2

      - name: Setup Node
        if: needs.changes.outputs.docs_only != 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install PHP dependencies
        if: needs.changes.outputs.docs_only != 'true'
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Install Node dependencies
        if: needs.changes.outputs.docs_only != 'true'
        run: npm ci --prefer-offline --no-audit

      - name: Download and verify built frontend assets
        if: needs.changes.outputs.docs_only != 'true'
        uses: actions/download-artifact@v4
        with:
          name: frontend-build-assets
          path: public/build

      - name: Verify built frontend assets
        if: needs.changes.outputs.docs_only != 'true'
        run: php bin/ci/frontend-artifact verify public/build

      - name: Prepare isolated test environment
        if: needs.changes.outputs.docs_only != 'true'
        run: |
          cp .env.example .env
          php artisan key:generate --force --no-interaction

      - name: Run focused readiness and release-preflight tests
        if: needs.changes.outputs.docs_only != 'true'
        id: readiness-tests
        run: >-
          php artisan test --compact
          tests/Feature/Phase4ReadinessGateTest.php
          tests/Feature/ReleasePreflightTest.php
          tests/Feature/ProductionReadinessP0P2Test.php
          tests/Feature/PhaseDProductionSmokeTest.php

      - name: Verify all four PHPUnit shards remain MECE
        if: needs.changes.outputs.docs_only != 'true'
        id: shard-mece
        run: php bin/ci/phpunit-shard verify --total=4

      - name: Verify OpenAPI contract drift
        if: needs.changes.outputs.docs_only != 'true'
        id: openapi
        run: bin/openapi.sh check

      - name: Verify UI baseline integrity
        if: needs.changes.outputs.docs_only != 'true'
        id: ui-baselines
        run: npm run ui:verify-baselines

      - name: Install Chromium and deterministic fonts
        if: needs.changes.outputs.docs_only != 'true'
        run: |
          npx playwright install --with-deps chromium
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y fonts-dejavu fonts-noto-core fonts-noto-ui-core

      - name: Prepare isolated deterministic Playwright environment
        if: needs.changes.outputs.docs_only != 'true'
        env:
          APP_ENV: playwright
        run: |
          cp .env.playwright.example .env.playwright
          php artisan --env=playwright key:generate --force --no-interaction
          mkdir -p database
          rm -f database/playwright.sqlite
          php artisan --env=playwright migrate:fresh --force --no-interaction
          php artisan --env=playwright db:seed --class=UiAuditSeeder --force --no-interaction
          php artisan --env=playwright storage:link --force --no-interaction
          php artisan --env=playwright wayfinder:generate --no-interaction

      - name: Verify frontend reuse for the Playwright environment
        if: needs.changes.outputs.docs_only != 'true'
        env:
          APP_ENV: playwright
        run: |
          php bin/ci/frontend-artifact verify-generated public/build
          rm -f public/hot

      - name: Verify UI Audit global setup lifecycle
        if: needs.changes.outputs.docs_only != 'true'
        env:
          APP_ENV: playwright
        run: npm run ui:test-global-setup

      - name: Run deterministic desktop accessibility audit
        if: needs.changes.outputs.docs_only != 'true'
        id: accessibility
        env:
          APP_ENV: playwright
          UI_AUDIT_MODE: accessibility
          UI_AUDIT_VIEWPORT: desktop
          UI_AUDIT_SCOPE: all
          UI_AUDIT_ENFORCE_COVERAGE: '1'
          UI_AUDIT_EVENT_NAME: ${{ github.event_name }}
          UI_AUDIT_REQUESTED_MODE: accessibility
          UI_AUDIT_REQUESTED_VIEWPORT: desktop
          UI_AUDIT_REQUESTED_SCOPE: all
          UI_AUDIT_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          UI_AUDIT_TESTED_SHA: ${{ github.sha }}
          UI_AUDIT_BASE_SHA: ${{ github.event.pull_request.base.sha || github.sha }}
          UI_AUDIT_PULL_REQUEST_NUMBER: ${{ github.event.pull_request.number || '' }}
          UI_AUDIT_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          UI_AUDIT_DEFAULT_BRANCH_SHA: ${{ github.event.pull_request.base.sha || github.sha }}
        run: npm run ui:a11y -- --project=desktop

      - name: Disposition FUNC-12 accessibility findings
        if: needs.changes.outputs.docs_only != 'true'
        id: accessibility-disposition
        run: node tests/visual/scripts/verify-func13-accessibility.mjs


      - name: Summarize Phase 4 execution evidence
        if: always()
        env:
          EXECUTION_RESULT: ${{ job.status }}
          DOCS_ONLY: ${{ needs.changes.outputs.docs_only }}
          READINESS_TESTS: ${{ steps.readiness-tests.outcome }}
          SHARD_MECE: ${{ steps.shard-mece.outcome }}
          OPENAPI: ${{ steps.openapi.outcome }}
          UI_BASELINES: ${{ steps.ui-baselines.outcome }}
          ACCESSIBILITY: ${{ steps.accessibility.outcome }}
          ACCESSIBILITY_DISPOSITION: ${{ steps.accessibility-disposition.outcome }}
        run: |
          {
            echo '## Phase 4 Readiness Execution'
            echo "- Documentation-only: $DOCS_ONLY"
            echo "- Focused readiness tests: ${READINESS_TESTS:-not run}"
            echo "- Shard MECE: ${SHARD_MECE:-not run}"
            echo "- OpenAPI: ${OPENAPI:-not run}"
            echo "- UI baseline integrity: ${UI_BASELINES:-not run}"
            echo "- Accessibility audit: ${ACCESSIBILITY:-not run}"
            echo "- Finding disposition: ${ACCESSIBILITY_DISPOSITION:-not run}"
            echo '- Known PARTIAL findings: docs/phase-4/FUNC-13-phase4-readiness-gate.md'
            echo "- Execution status: $EXECUTION_RESULT"
            echo '- Final decision belongs to the separate mandatory readiness gate.'
          } >> "$GITHUB_STEP_SUMMARY"


  phase4-readiness:
    name: Phase 4 Readiness Gate
    needs:
      - changes
      - dependency-audit
      - style
      - frontend-build
      - generated-drift
      - phpunit-shard
      - unit-feature-tests
      - seed-integrity-gate
      - migration-seed
      - openapi-drift
      - postgres-concurrency
      - phase4-execution
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fail closed unless every required CI job passed
        env:
          DOCS_ONLY: ${{ needs.changes.outputs.docs_only }}
          CI_NEEDS: ${{ toJSON(needs) }}
        run: php bin/ci/readiness-results
      - name: Summarize final readiness decision
        if: always()
        env:
          DECISION: ${{ job.status }}
          DOCS_ONLY: ${{ needs.changes.outputs.docs_only }}
        run: |
          {
            echo '## Phase 4 Readiness Gate'
            echo "- Documentation-only: $DOCS_ONLY"
            echo "- All mandatory upstream results: $DECISION"
            echo '- Phase 4 execution is an independently required upstream job.'
          } >> "$GITHUB_STEP_SUMMARY"
