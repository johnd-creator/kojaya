name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  APP_ENV: testing

jobs:
  dependency-audit:
    name: Dependency Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: bcmath, ctype, fileinfo, json, mbstring, openssl, pdo, pdo_sqlite, tokenizer, xml
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: composer install --no-interaction --prefer-dist --no-progress
      - run: npm ci --prefer-offline --no-audit
      - run: composer audit --locked --ignore-severity=medium --ignore-severity=low --abandoned=report
      - run: npm audit --omit=dev --audit-level=high

  style:
    name: Pint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: bcmath, ctype, fileinfo, json, mbstring, openssl, pdo, pdo_sqlite, tokenizer, xml
      - run: composer install --no-interaction --prefer-dist --no-progress
      - run: vendor/bin/pint --test

  frontend-build:
    name: Frontend Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: bcmath, ctype, fileinfo, json, mbstring, openssl, pdo, pdo_sqlite, tokenizer, xml
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: composer install --no-interaction --prefer-dist --no-progress
      - run: npm ci --prefer-offline --no-audit
      - run: cp .env.example .env
      - run: php artisan key:generate
      - run: php artisan wayfinder:generate
        env:
          APP_ENV: local
      - run: npm run build

  generated-drift:
    name: Generated Drift
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: bcmath, ctype, fileinfo, json, mbstring, openssl, pdo, pdo_sqlite, tokenizer, xml
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: composer install --no-interaction --prefer-dist --no-progress
      - run: npm ci --prefer-offline --no-audit
      - run: cp .env.example .env
      - run: php artisan key:generate
      - run: test -z "$(git ls-files resources/js/actions resources/js/routes)"
      - run: php artisan wayfinder:generate
        env:
          APP_ENV: local
      - run: |
          test -n "$(find resources/js/actions -type f -print -quit)"
          test -n "$(find resources/js/routes -type f -print -quit)"
      - run: npm run build

  unit-feature-tests:
    name: PHPUnit Parallel
    runs-on: ubuntu-latest
    services:
      selenium:
        image: selenium/standalone-chrome:latest
        ports:
          - 4444:4444
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: bcmath, ctype, fileinfo, json, mbstring, openssl, pdo, pdo_sqlite, tokenizer, xml
          coverage: xdebug
      - run: composer install --no-interaction --prefer-dist --no-progress
      - run: npm ci --prefer-offline --no-audit
      - run: cp .env.example .env
      - run: php artisan key:generate
      - run: php artisan wayfinder:generate
        env:
          APP_ENV: local
      - run: npm run build
      # Required evidence command (profile is enabled through Collision below because
      # ParaTest 7 does not accept Laravel's --profile option as a CLI argument).
      # php artisan test --compact --parallel --profile --coverage --min=70
      - run: php artisan test --compact --parallel --coverage --min=60
        env:
          COLLISION_PRINTER_PROFILE: 'true'
      - name: Legacy ERP Recovery Wave 1
        run: >-
          php artisan test --compact
          tests/Feature/LegacyErp/EmployeeScopeTest.php
          tests/Feature/LegacyErp/BudgetImportTest.php
          tests/Feature/LegacyErp/BankIntegrationTest.php
          tests/Feature/LegacyErp/InvoiceFlowTest.php

  migration-seed:
    name: Migration and Seed
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: bcmath, ctype, fileinfo, json, mbstring, openssl, pdo, pdo_sqlite, tokenizer, xml
      - run: composer install --no-interaction --prefer-dist --no-progress
      - run: cp .env.example .env
      - run: php artisan key:generate
      - run: touch database/database.sqlite
      - run: php artisan migrate:fresh --seed --force
        env:
          DB_CONNECTION: sqlite
          DB_DATABASE: database/database.sqlite

  openapi-drift:
    name: OpenAPI Drift
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: bcmath, ctype, fileinfo, json, mbstring, openssl, pdo, pdo_sqlite, tokenizer, xml
      - run: composer install --no-interaction --prefer-dist --no-progress
      - run: cp .env.example .env
      - run: php artisan key:generate
      - run: bin/openapi.sh check

  postgres-concurrency:
    name: PostgreSQL Concurrency
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: kojaya_test
          POSTGRES_USER: kojaya
          POSTGRES_PASSWORD: kojaya
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U kojaya -d kojaya_test"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: bcmath, ctype, fileinfo, json, mbstring, openssl, pdo, pdo_pgsql, pdo_sqlite, tokenizer, xml
      - run: composer install --no-interaction --prefer-dist --no-progress
      - run: cp .env.example .env
      - run: php artisan key:generate
      - run: vendor/bin/phpunit --configuration phpunit.pgsql.xml --testsuite PostgreSQLConcurrency
        env:
          DB_CONNECTION: pgsql
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          DB_DATABASE: kojaya_test
          DB_USERNAME: kojaya
          DB_PASSWORD: kojaya
      - run: vendor/bin/phpunit --configuration phpunit.pgsql.xml --testsuite Document05PostgreSQL
        env:
          DB_CONNECTION: pgsql
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          DB_DATABASE: kojaya_test
          DB_USERNAME: kojaya
          DB_PASSWORD: kojaya
