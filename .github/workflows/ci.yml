name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  APP_ENV: testing

jobs:
  changes:
    name: Change Classification
    runs-on: ubuntu-latest
    outputs:
      docs_only: ${{ steps.classify.outputs.docs_only }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Classify changed paths
        id: classify
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          CURRENT_SHA: ${{ github.sha }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail

          base_sha="$BEFORE_SHA"
          head_sha="$CURRENT_SHA"

          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            base_sha="$PR_BASE_SHA"
            head_sha="$PR_HEAD_SHA"
          fi

          if [[ ! "$base_sha" =~ ^[0-9a-fA-F]{40}$ ]] || [[ ! "$head_sha" =~ ^[0-9a-fA-F]{40}$ ]]; then
            printf 'Unable to resolve a complete comparison range; running full CI.\n'
            printf 'docs_only=false\n' >> "$GITHUB_OUTPUT"
            exit 0
          fi

          mapfile -t changed_files < <(git diff --name-only "$base_sha" "$head_sha")

          if ((${#changed_files[@]} == 0)); then
            printf 'No changed files detected; running full CI.\n'
            printf 'docs_only=false\n' >> "$GITHUB_OUTPUT"
            exit 0
          fi

          is_documentation_path() {
            [[ "$1" == "CHANGELOG.md" || "$1" == "README.md" || "$1" =~ ^docs/.+\.md$ ]]
          }

          classify_paths() {
            local result=true
            local file

            for file in "$@"; do
              if ! is_documentation_path "$file"; then
                result=false
                break
              fi
            done

            printf '%s' "$result"
          }

          assert_classification() {
            local expected="$1"
            shift
            local actual

            actual="$(classify_paths "$@")"
            if [[ "$actual" != "$expected" ]]; then
              printf 'Classifier regression for expected=%s actual=%s paths=%s\n' "$expected" "$actual" "$*" >&2
              return 1
            fi
          }

          assert_classification true docs/example.md
          assert_classification true docs/nested/example.md
          assert_classification true CHANGELOG.md
          assert_classification true README.md
          assert_classification false .github/workflows/ci.yml
          assert_classification false app/Example.php
          assert_classification false app/src/Example.kt
          assert_classification false resources/js/app.js
          assert_classification false config/app.php
          assert_classification false database/migrations/example.php
          assert_classification false composer.lock
          assert_classification false docs/example.mdx
          assert_classification false docs/example.txt
          assert_classification false notes.md
          assert_classification false docs/example.md app/Example.php

          docs_only="$(classify_paths "${changed_files[@]}")"

          printf 'Changed paths classified as docs_only=%s.\n' "$docs_only"
          printf 'docs_only=%s\n' "$docs_only" >> "$GITHUB_OUTPUT"

  dependency-audit:
    name: Dependency Audit
    needs: changes
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Fail closed when change classification fails
        if: needs.changes.result != 'success'
        run: exit 1

      - name: Docs-only success path
        if: needs.changes.result == 'success' && needs.changes.outputs.docs_only == 'true'
        run: printf 'Dependency Audit skipped for documentation-only changes.\n'

      - uses: actions/checkout@v4
        if: needs.changes.result == 'success' && needs.changes.outputs.docs_only != 'true'
      - uses: shivammathur/setup-php@v2
        if: needs.changes.result == 'success' && needs.changes.outputs.docs_only != 'true'
        with:
          php-version: '8.4'
          extensions: bcmath, ctype, fileinfo, json, mbstring, openssl, pdo, pdo_sqlite, tokenizer, xml
      - uses: actions/setup-node@v4
        if: needs.changes.result == 'success' && needs.changes.outputs.docs_only != 'true'
        with:
          node-version: '22'
      - run: composer install --no-interaction --prefer-dist --no-progress
        if: needs.changes.result == 'success' && needs.changes.outputs.docs_only != 'true'
      - run: npm ci --prefer-offline --no-audit
        if: needs.changes.result == 'success' && needs.changes.outputs.docs_only != 'true'
      - run: composer audit --locked --ignore-severity=medium --ignore-severity=low --abandoned=report
        if: needs.changes.result == 'success' && needs.changes.outputs.docs_only != 'true'
      - run: npm audit --omit=dev --audit-level=high
        if: needs.changes.result == 'success' && needs.changes.outputs.docs_only != 'true'

  style:
    name: Pint
    needs: changes
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Fail closed when change classification fails
        if: needs.changes.result != 'success'
        run: exit 1

      - name: Docs-only success path
        if: needs.changes.result == 'success' && needs.changes.outputs.docs_only == 'true'
        run: printf 'Pint skipped for documentation-only changes.\n'

      - uses: actions/checkout@v4
        if: needs.changes.result == 'success' && needs.changes.outputs.docs_only != 'true'
      - uses: shivammathur/setup-php@v2
        if: needs.changes.result == 'success' && needs.changes.outputs.docs_only != 'true'
        with:
          php-version: '8.4'
          extensions: bcmath, ctype, fileinfo, json, mbstring, openssl, pdo, pdo_sqlite, tokenizer, xml
      - run: composer install --no-interaction --prefer-dist --no-progress
        if: needs.changes.result == 'success' && needs.changes.outputs.docs_only != 'true'
      - run: vendor/bin/pint --test
        if: needs.changes.result == 'success' && needs.changes.outputs.docs_only != 'true'

  frontend-build:
    name: Frontend Build
    needs: changes
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Fail closed when change classification fails
        if: needs.changes.result != 'success'
        run: exit 1

      - name: Docs-only success path
        if: needs.changes.result == 'success' && needs.changes.outputs.docs_only == 'true'
        run: printf 'Frontend Build skipped for documentation-only changes.\n'

      - uses: actions/checkout@v4
        if: needs.changes.result == 'success' && needs.changes.outputs.docs_only != 'true'
      - uses: shivammathur/setup-php@v2
        if: needs.changes.result == 'success' && needs.changes.outputs.docs_only != 'true'
        with:
          php-version: '8.4'
          extensions: bcmath, ctype, fileinfo, json, mbstring, openssl, pdo, pdo_sqlite, tokenizer, xml
      - uses: actions/setup-node@v4
        if: needs.changes.result == 'success' && needs.changes.outputs.docs_only != 'true'
        with:
          node-version: '22'
      - run: composer install --no-interaction --prefer-dist --no-progress
        if: needs.changes.result == 'success' && needs.changes.outputs.docs_only != 'true'
      - run: npm ci --prefer-offline --no-audit
        if: needs.changes.result == 'success' && needs.changes.outputs.docs_only != 'true'
      - run: cp .env.example .env
        if: needs.changes.result == 'success' && needs.changes.outputs.docs_only != 'true'
      - run: php artisan key:generate
        if: needs.changes.result == 'success' && needs.changes.outputs.docs_only != 'true'
      - run: php artisan wayfinder:generate
        if: needs.changes.result == 'success' && needs.changes.outputs.docs_only != 'true'
        env:
          APP_ENV: local
      - run: npm run build
        if: needs.changes.result == 'success' && needs.changes.outputs.docs_only != 'true'
      - uses: actions/upload-artifact@v4
        if: needs.changes.result == 'success' && needs.changes.outputs.docs_only != 'true'
        with:
          name: frontend-build-assets
          path: public/build
          retention-days: 1

  generated-drift:
    name: Generated Drift
    needs: changes
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Fail closed when change classification fails
        if: needs.changes.result != 'success'
        run: exit 1

      - name: Docs-only success path
        if: needs.changes.result == 'success' && needs.changes.outputs.docs_only == 'true'
        run: printf 'Generated Drift skipped for documentation-only changes.\n'

      - uses: actions/checkout@v4
        if: needs.changes.result == 'success' && needs.changes.outputs.docs_only != 'true'
      - uses: shivammathur/setup-php@v2
        if: needs.changes.result == 'success' && needs.changes.outputs.docs_only != 'true'
        with:
          php-version: '8.4'
          extensions: bcmath, ctype, fileinfo, json, mbstring, openssl, pdo, pdo_sqlite, tokenizer, xml
      - uses: actions/setup-node@v4
        if: needs.changes.result == 'success' && needs.changes.outputs.docs_only != 'true'
        with:
          node-version: '22'
      - run: composer install --no-interaction --prefer-dist --no-progress
        if: needs.changes.result == 'success' && needs.changes.outputs.docs_only != 'true'
      - run: npm ci --prefer-offline --no-audit
        if: needs.changes.result == 'success' && needs.changes.outputs.docs_only != 'true'
      - run: cp .env.example .env
        if: needs.changes.result == 'success' && needs.changes.outputs.docs_only != 'true'
      - run: php artisan key:generate
        if: needs.changes.result == 'success' && needs.changes.outputs.docs_only != 'true'
      - run: test -z "$(git ls-files resources/js/actions resources/js/routes)"
        if: needs.changes.result == 'success' && needs.changes.outputs.docs_only != 'true'
      - run: php artisan wayfinder:generate
        if: needs.changes.result == 'success' && needs.changes.outputs.docs_only != 'true'
        env:
          APP_ENV: local
      - run: |
          test -n "$(find resources/js/actions -type f -print -quit)"
          test -n "$(find resources/js/routes -type f -print -quit)"
        if: needs.changes.result == 'success' && needs.changes.outputs.docs_only != 'true'
      - run: npm run build
        if: needs.changes.result == 'success' && needs.changes.outputs.docs_only != 'true'

  phpunit-shard:
    name: PHPUnit Shard (${{ matrix.shard }}/4)
    needs: [changes, frontend-build]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - name: Fail closed when change classification fails
        if: needs.changes.result != 'success'
        run: exit 1

      - name: Docs-only success path
        if: needs.changes.result == 'success' && needs.changes.outputs.docs_only == 'true'
        run: printf 'PHPUnit Shard skipped for documentation-only changes.\n'

      - name: Fail closed if frontend build failed
        if: needs.changes.result == 'success' && needs.changes.outputs.docs_only != 'true'
        run: |
          if [[ "${{ needs.frontend-build.result }}" != "success" ]]; then
            echo "::error::Frontend build dependency failed!"
            exit 1
          fi

      - uses: actions/checkout@v4
        if: needs.changes.result == 'success' && needs.changes.outputs.docs_only != 'true'
      - uses: shivammathur/setup-php@v2
        if: needs.changes.result == 'success' && needs.changes.outputs.docs_only != 'true'
        with:
          php-version: '8.4'
          extensions: bcmath, ctype, fileinfo, json, mbstring, openssl, pdo, pdo_sqlite, tokenizer, xml
          coverage: xdebug
      - run: composer install --no-interaction --prefer-dist --no-progress
        if: needs.changes.result == 'success' && needs.changes.outputs.docs_only != 'true'
      - uses: actions/download-artifact@v4
        if: needs.changes.result == 'success' && needs.changes.outputs.docs_only != 'true'
        with:
          name: frontend-build-assets
          path: public/build
      - name: Verify frontend build assets
        if: needs.changes.result == 'success' && needs.changes.outputs.docs_only != 'true'
        run: test -f public/build/manifest.json
      - run: cp .env.example .env
        if: needs.changes.result == 'success' && needs.changes.outputs.docs_only != 'true'
      - run: php artisan key:generate
        if: needs.changes.result == 'success' && needs.changes.outputs.docs_only != 'true'
      - name: Verify shard partition integrity
        if: needs.changes.result == 'success' && needs.changes.outputs.docs_only != 'true'
        run: php bin/ci/phpunit-shard verify --total=4
      - name: Generate shard configuration
        if: needs.changes.result == 'success' && needs.changes.outputs.docs_only != 'true'
        run: >-
          php bin/ci/phpunit-shard generate-config
          --shard=${{ matrix.shard }}
          --total=4
          --output=phpunit.shard.xml
          --coverage-file=build/artifacts/shard-${{ matrix.shard }}.cov
          --junit-file=build/artifacts/shard-${{ matrix.shard }}.xml
      - name: Run PHPUnit Shard ${{ matrix.shard }}/4
        if: needs.changes.result == 'success' && needs.changes.outputs.docs_only != 'true'
        run: php artisan test --compact --parallel --configuration=phpunit.shard.xml
        env:
          COLLISION_PRINTER_PROFILE: 'true'
          XDEBUG_MODE: coverage
      - uses: actions/upload-artifact@v4
        if: needs.changes.result == 'success' && needs.changes.outputs.docs_only != 'true'
        with:
          name: phpunit-shard-${{ matrix.shard }}
          path: |
            build/artifacts/shard-${{ matrix.shard }}.cov
            build/artifacts/shard-${{ matrix.shard }}.xml
          if-no-files-found: error
          retention-days: 1

  unit-feature-tests:
    name: PHPUnit Parallel
    needs: [changes, phpunit-shard]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Fail closed when change classification fails
        if: needs.changes.result != 'success'
        run: exit 1

      - name: Docs-only success path
        if: needs.changes.result == 'success' && needs.changes.outputs.docs_only == 'true'
        run: printf 'PHPUnit Parallel skipped for documentation-only changes.\n'

      - name: Fail closed if any PHPUnit shard failed
        if: needs.changes.result == 'success' && needs.changes.outputs.docs_only != 'true'
        run: |
          if [[ "${{ needs.phpunit-shard.result }}" != "success" ]]; then
            echo "::error::One or more PHPUnit shards failed! Shard matrix status: ${{ needs.phpunit-shard.result }}"
            exit 1
          fi

      - uses: actions/checkout@v4
        if: needs.changes.result == 'success' && needs.changes.outputs.docs_only != 'true'
      - uses: shivammathur/setup-php@v2
        if: needs.changes.result == 'success' && needs.changes.outputs.docs_only != 'true'
        with:
          php-version: '8.4'
          extensions: bcmath, ctype, fileinfo, json, mbstring, openssl, pdo, pdo_sqlite, tokenizer, xml
      - run: composer install --no-interaction --prefer-dist --no-progress
        if: needs.changes.result == 'success' && needs.changes.outputs.docs_only != 'true'
      - uses: actions/download-artifact@v4
        if: needs.changes.result == 'success' && needs.changes.outputs.docs_only != 'true'
        with:
          pattern: phpunit-shard-*
          path: build/artifacts
          merge-multiple: true
      - name: Aggregate Shard Results & Enforce Quality Gates
        if: needs.changes.result == 'success' && needs.changes.outputs.docs_only != 'true'
        run: php bin/ci/phpunit-aggregate --total=4 --artifacts-dir=build/artifacts --min-coverage=60 --min-tests=2211


  seed-integrity-gate:
    name: SEED-09 — Seed Integrity & Readiness Gate
    needs: [changes, frontend-build]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Fail closed when change classification fails
        if: needs.changes.result != 'success'
        run: exit 1

      - name: Docs-only success path
        if: needs.changes.result == 'success' && needs.changes.outputs.docs_only == 'true'
        run: printf 'SEED-09 skipped for documentation-only changes.\n'

      - name: Fail closed if frontend build failed
        if: needs.changes.result == 'success' && needs.changes.outputs.docs_only != 'true'
        run: |
          if [[ "${{ needs.frontend-build.result }}" != "success" ]]; then
            echo "::error::Frontend build dependency failed!"
            exit 1
          fi

      - uses: actions/checkout@v4
        if: needs.changes.result == 'success' && needs.changes.outputs.docs_only != 'true'
      - uses: shivammathur/setup-php@v2
        if: needs.changes.result == 'success' && needs.changes.outputs.docs_only != 'true'
        with:
          php-version: '8.4'
          extensions: bcmath, ctype, fileinfo, json, mbstring, openssl, pdo, pdo_sqlite, tokenizer, xml
      - run: composer install --no-interaction --prefer-dist --no-progress
        if: needs.changes.result == 'success' && needs.changes.outputs.docs_only != 'true'
      - uses: actions/download-artifact@v4
        if: needs.changes.result == 'success' && needs.changes.outputs.docs_only != 'true'
        with:
          name: frontend-build-assets
          path: public/build
      - name: Verify frontend build assets
        if: needs.changes.result == 'success' && needs.changes.outputs.docs_only != 'true'
        run: test -f public/build/manifest.json
      - run: cp .env.example .env
        if: needs.changes.result == 'success' && needs.changes.outputs.docs_only != 'true'
      - run: php artisan key:generate
        if: needs.changes.result == 'success' && needs.changes.outputs.docs_only != 'true'
      - name: Run SEED-09 Seed Integrity & Readiness Gate
        if: needs.changes.result == 'success' && needs.changes.outputs.docs_only != 'true'
        run: php artisan test --compact tests/Feature/SEED09/SeedIntegrityGateTest.php

  migration-seed:
    name: Migration and Seed
    needs: changes
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Fail closed when change classification fails
        if: needs.changes.result != 'success'
        run: exit 1

      - name: Docs-only success path
        if: needs.changes.result == 'success' && needs.changes.outputs.docs_only == 'true'
        run: printf 'Migration and Seed skipped for documentation-only changes.\n'

      - uses: actions/checkout@v4
        if: needs.changes.result == 'success' && needs.changes.outputs.docs_only != 'true'
      - uses: shivammathur/setup-php@v2
        if: needs.changes.result == 'success' && needs.changes.outputs.docs_only != 'true'
        with:
          php-version: '8.4'
          extensions: bcmath, ctype, fileinfo, json, mbstring, openssl, pdo, pdo_sqlite, tokenizer, xml
      - run: composer install --no-interaction --prefer-dist --no-progress
        if: needs.changes.result == 'success' && needs.changes.outputs.docs_only != 'true'
      - run: cp .env.example .env
        if: needs.changes.result == 'success' && needs.changes.outputs.docs_only != 'true'
      - run: php artisan key:generate
        if: needs.changes.result == 'success' && needs.changes.outputs.docs_only != 'true'
      - run: touch database/database.sqlite
        if: needs.changes.result == 'success' && needs.changes.outputs.docs_only != 'true'
      - run: php artisan migrate:fresh --seed --force
        if: needs.changes.result == 'success' && needs.changes.outputs.docs_only != 'true'
        env:
          DB_CONNECTION: sqlite
          DB_DATABASE: database/database.sqlite

  openapi-drift:
    name: OpenAPI Drift
    needs: changes
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Fail closed when change classification fails
        if: needs.changes.result != 'success'
        run: exit 1

      - name: Docs-only success path
        if: needs.changes.result == 'success' && needs.changes.outputs.docs_only == 'true'
        run: printf 'OpenAPI Drift skipped for documentation-only changes.\n'

      - uses: actions/checkout@v4
        if: needs.changes.result == 'success' && needs.changes.outputs.docs_only != 'true'
      - uses: shivammathur/setup-php@v2
        if: needs.changes.result == 'success' && needs.changes.outputs.docs_only != 'true'
        with:
          php-version: '8.4'
          extensions: bcmath, ctype, fileinfo, json, mbstring, openssl, pdo, pdo_sqlite, tokenizer, xml
      - run: composer install --no-interaction --prefer-dist --no-progress
        if: needs.changes.result == 'success' && needs.changes.outputs.docs_only != 'true'
      - run: cp .env.example .env
        if: needs.changes.result == 'success' && needs.changes.outputs.docs_only != 'true'
      - run: php artisan key:generate
        if: needs.changes.result == 'success' && needs.changes.outputs.docs_only != 'true'
      - run: bin/openapi.sh check
        if: needs.changes.result == 'success' && needs.changes.outputs.docs_only != 'true'

  postgres-concurrency:
    name: PostgreSQL Concurrency
    needs: changes
    if: ${{ always() }}
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: kojaya_test
          POSTGRES_USER: kojaya
          POSTGRES_PASSWORD: kojaya
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U kojaya -d kojaya_test"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    steps:
      - name: Fail closed when change classification fails
        if: needs.changes.result != 'success'
        run: exit 1

      - name: Docs-only success path
        if: needs.changes.result == 'success' && needs.changes.outputs.docs_only == 'true'
        run: printf 'PostgreSQL Concurrency skipped for documentation-only changes.\n'

      - uses: actions/checkout@v4
        if: needs.changes.result == 'success' && needs.changes.outputs.docs_only != 'true'
      - uses: shivammathur/setup-php@v2
        if: needs.changes.result == 'success' && needs.changes.outputs.docs_only != 'true'
        with:
          php-version: '8.4'
          extensions: bcmath, ctype, fileinfo, json, mbstring, openssl, pdo, pdo_pgsql, pdo_sqlite, tokenizer, xml
      - run: composer install --no-interaction --prefer-dist --no-progress
        if: needs.changes.result == 'success' && needs.changes.outputs.docs_only != 'true'
      - run: cp .env.example .env
        if: needs.changes.result == 'success' && needs.changes.outputs.docs_only != 'true'
      - run: php artisan key:generate
        if: needs.changes.result == 'success' && needs.changes.outputs.docs_only != 'true'
      - run: vendor/bin/phpunit --configuration phpunit.pgsql.xml --testsuite PostgreSQLConcurrency
        if: needs.changes.result == 'success' && needs.changes.outputs.docs_only != 'true'
        env:
          DB_CONNECTION: pgsql
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          DB_DATABASE: kojaya_test
          DB_USERNAME: kojaya
          DB_PASSWORD: kojaya
      - run: vendor/bin/phpunit --configuration phpunit.pgsql.xml --testsuite Document05PostgreSQL
        if: needs.changes.result == 'success' && needs.changes.outputs.docs_only != 'true'
        env:
          DB_CONNECTION: pgsql
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          DB_DATABASE: kojaya_test
          DB_USERNAME: kojaya
          DB_PASSWORD: kojaya
      - name: Install PostgreSQL client tools
        if: needs.changes.result == 'success' && needs.changes.outputs.docs_only != 'true'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client
      - name: PostgreSQL Backup and Restore Drill
        if: needs.changes.result == 'success' && needs.changes.outputs.docs_only != 'true'
        run: vendor/bin/phpunit --configuration phpunit.pgsql.xml --testsuite BackupRestoreDrill --display-skipped
        env:
          DB_CONNECTION: pgsql
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          DB_DATABASE: kojaya_test
          DB_USERNAME: kojaya
          DB_PASSWORD: kojaya

  phase4-readiness:
    name: Phase 4 Readiness Gate
    needs:
      - changes
      - dependency-audit
      - style
      - frontend-build
      - generated-drift
      - phpunit-shard
      - unit-feature-tests
      - seed-integrity-gate
      - migration-seed
      - openapi-drift
      - postgres-concurrency
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Fail closed unless every required CI job passed
        shell: bash
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          DOCS_ONLY: ${{ needs.changes.outputs.docs_only }}
          DEPENDENCY_AUDIT_RESULT: ${{ needs.dependency-audit.result }}
          STYLE_RESULT: ${{ needs.style.result }}
          FRONTEND_BUILD_RESULT: ${{ needs.frontend-build.result }}
          GENERATED_DRIFT_RESULT: ${{ needs.generated-drift.result }}
          PHPUNIT_SHARD_RESULT: ${{ needs.phpunit-shard.result }}
          UNIT_FEATURE_TESTS_RESULT: ${{ needs.unit-feature-tests.result }}
          SEED_INTEGRITY_RESULT: ${{ needs.seed-integrity-gate.result }}
          MIGRATION_SEED_RESULT: ${{ needs.migration-seed.result }}
          OPENAPI_DRIFT_RESULT: ${{ needs.openapi-drift.result }}
          POSTGRES_RESULT: ${{ needs.postgres-concurrency.result }}
        run: |
          set -euo pipefail

          if [[ "$DOCS_ONLY" != "false" ]]; then
            echo "::error::FUNC-13 requires the full CI path; docs_only=$DOCS_ONLY"
            exit 1
          fi

          for result_name in \
            CHANGES_RESULT \
            DEPENDENCY_AUDIT_RESULT \
            STYLE_RESULT \
            FRONTEND_BUILD_RESULT \
            GENERATED_DRIFT_RESULT \
            PHPUNIT_SHARD_RESULT \
            UNIT_FEATURE_TESTS_RESULT \
            SEED_INTEGRITY_RESULT \
            MIGRATION_SEED_RESULT \
            OPENAPI_DRIFT_RESULT \
            POSTGRES_RESULT; do
            result="${!result_name}"
            if [[ "$result" != "success" ]]; then
              echo "::error::Required upstream job $result_name ended with $result"
              exit 1
            fi
          done

          echo "All required upstream CI dependencies: PASS"

      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: bcmath, ctype, fileinfo, json, mbstring, openssl, pdo, pdo_sqlite, tokenizer, xml
          tools: composer:v2

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Install Node dependencies
        run: npm ci --prefer-offline --no-audit

      - name: Download and verify built frontend assets
        uses: actions/download-artifact@v4
        with:
          name: frontend-build-assets
          path: public/build

      - name: Verify built frontend assets
        run: test -f public/build/manifest.json

      - name: Prepare isolated test environment
        run: |
          cp .env.example .env
          php artisan key:generate --force --no-interaction

      - name: Run focused readiness and release-preflight tests
        id: readiness-tests
        run: >-
          php artisan test --compact
          tests/Feature/Phase4ReadinessGateTest.php
          tests/Feature/ReleasePreflightTest.php
          tests/Feature/ProductionReadinessP0P2Test.php
          tests/Feature/PhaseDProductionSmokeTest.php

      - name: Verify all four PHPUnit shards remain MECE
        id: shard-mece
        run: php bin/ci/phpunit-shard verify --total=4

      - name: Verify OpenAPI contract drift
        id: openapi
        run: bin/openapi.sh check

      - name: Verify UI baseline integrity
        id: ui-baselines
        run: npm run ui:verify-baselines

      - name: Install Chromium and deterministic fonts
        run: |
          npx playwright install --with-deps chromium
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y fonts-dejavu fonts-noto-core fonts-noto-ui-core

      - name: Prepare isolated deterministic Playwright environment
        env:
          APP_ENV: playwright
        run: |
          cp .env.playwright.example .env.playwright
          php artisan --env=playwright key:generate --force --no-interaction
          mkdir -p database
          rm -f database/playwright.sqlite
          php artisan --env=playwright migrate:fresh --force --no-interaction
          php artisan --env=playwright db:seed --class=UiAuditSeeder --force --no-interaction
          php artisan --env=playwright storage:link --force --no-interaction
          php artisan --env=playwright wayfinder:generate --no-interaction

      - name: Build frontend for the Playwright environment
        env:
          APP_ENV: playwright
        run: |
          npm run build
          rm -f public/hot

      - name: Verify UI Audit global setup lifecycle
        env:
          APP_ENV: playwright
        run: npm run ui:test-global-setup

      - name: Run deterministic desktop accessibility audit
        id: accessibility
        env:
          APP_ENV: playwright
          UI_AUDIT_MODE: accessibility
          UI_AUDIT_VIEWPORT: desktop
          UI_AUDIT_SCOPE: all
          UI_AUDIT_ENFORCE_COVERAGE: '1'
          UI_AUDIT_EVENT_NAME: ${{ github.event_name }}
          UI_AUDIT_REQUESTED_MODE: accessibility
          UI_AUDIT_REQUESTED_VIEWPORT: desktop
          UI_AUDIT_REQUESTED_SCOPE: all
          UI_AUDIT_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          UI_AUDIT_TESTED_SHA: ${{ github.sha }}
          UI_AUDIT_BASE_SHA: ${{ github.event.pull_request.base.sha || github.sha }}
          UI_AUDIT_PULL_REQUEST_NUMBER: ${{ github.event.pull_request.number || '' }}
          UI_AUDIT_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          UI_AUDIT_DEFAULT_BRANCH_SHA: ${{ github.event.pull_request.base.sha || github.sha }}
        run: npm run ui:a11y -- --project=desktop

      - name: Disposition FUNC-12 accessibility findings
        id: accessibility-disposition
        run: node tests/visual/scripts/verify-func13-accessibility.mjs

      - name: Summarize Phase 4 readiness evidence
        if: always()
        env:
          UPSTREAM_RESULT: ${{ job.status }}
          READINESS_TESTS: ${{ steps.readiness-tests.outcome }}
          SHARD_MECE: ${{ steps.shard-mece.outcome }}
          OPENAPI: ${{ steps.openapi.outcome }}
          UI_BASELINES: ${{ steps.ui-baselines.outcome }}
          ACCESSIBILITY: ${{ steps.accessibility.outcome }}
          ACCESSIBILITY_DISPOSITION: ${{ steps.accessibility-disposition.outcome }}
        run: |
          {
            echo '## Phase 4 Readiness Gate'
            echo "- Upstream CI dependencies: ${{ needs.changes.result == 'success' && needs.dependency-audit.result == 'success' && needs.style.result == 'success' && needs.frontend-build.result == 'success' && needs.generated-drift.result == 'success' && needs.phpunit-shard.result == 'success' && needs.unit-feature-tests.result == 'success' && needs.seed-integrity-gate.result == 'success' && needs.migration-seed.result == 'success' && needs.openapi-drift.result == 'success' && needs.postgres-concurrency.result == 'success' && needs.changes.outputs.docs_only == 'false' && 'PASS' || 'HOLD' }}"
            echo "- Phase4ReadinessGateTest and release-preflight suites: ${READINESS_TESTS:-not run}"
            echo "- Shard MECE: ${SHARD_MECE:-not run}"
            echo "- OpenAPI: ${OPENAPI:-not run}"
            echo "- UI baseline integrity: ${UI_BASELINES:-not run}"
            echo "- Accessibility audit: ${ACCESSIBILITY:-not run}"
            echo "- FUNC-12 accessibility finding disposition: ${ACCESSIBILITY_DISPOSITION:-not run}"
            echo '- Known PARTIAL findings: documented in docs/phase-4/FUNC-13-phase4-readiness-gate.md'
            echo "- Job status: ${UPSTREAM_RESULT}"
          } >> "$GITHUB_STEP_SUMMARY"
